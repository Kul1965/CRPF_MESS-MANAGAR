
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mess Data Backup</title>
<style>
body{font-family:Arial;background:#f1f5f2;padding:18px;color:#203328}
main{max-width:550px;margin:auto;background:white;padding:20px;border-radius:12px}
button{padding:13px;border:0;border-radius:7px;background:#24583b;color:white;margin:6px 0;width:100%;cursor:pointer}
.gray{background:#65736a}
input{margin:12px 0}
#msg{overflow-wrap:anywhere;color:#24583b}
</style>
</head>
<body>
<main>
<h2>Army Mess - Data Backup</h2>
<p>सदस्यको डेटा सुरक्षित राख्नुहोस्।</p>

<button onclick="downloadBackup()">⬇ Backup डाउनलोड</button>

<label>Backup फाइलबाट Restore गर्नुहोस्:</label>
<input type="file" id="file" accept=".json,application/json">

<button onclick="restoreBackup()">↻ Restore Data</button>
<button class="bleu" onclick="location.href='index.html'">← Move to Dashboard</button>

<p id="msg"></p>
</main>

<script>
const KEY="armyMessDemoMembersV1";

function downloadBackup(){
 try{
  const data=localStorage.getItem(KEY);
  if(data===null){
   alert("यस ब्राउजरमा सदस्यको डेटा भेटिएन।");
   return;
  }

  const backup={
   app:"Army Smart Mess Demo",
   version:1,
   date:new Date().toISOString(),
   members:JSON.parse(data)
  };

  const blob=new Blob(
   [JSON.stringify(backup,null,2)],
   {type:"application/json"}
  );
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="mess-members-backup.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  document.getElementById("msg").textContent="Backup डाउनलोड सुरु भयो।";
 }catch(e){
  alert("Backup बनाउन सकिएन।");
 }
}

async function restoreBackup(){
 const file=document.getElementById("file").files[0];
 if(!file){alert("पहिले Backup JSON फाइल छान्नुहोस्।");return}

 try{
  const data=JSON.parse(await file.text());
  if(data.app!=="Army Smart Mess Demo"||!Array.isArray(data.members)){
   alert("यो सही Mess Backup फाइल होइन।");
   return;
  }

  const valid=data.members.every(m=>
   m&&typeof m.id==="string"&&
   typeof m.number==="string"&&
   typeof m.name==="string"
  );
  if(!valid){alert("Backup मा डेटा ढाँचा मिलेन।");return}

  if(!confirm("Restore गर्दा हालको सदस्य सूची बदलिनेछ। पहिले हालको डेटा Backup गर्नुभएको छ?"))return;

  localStorage.setItem(KEY,JSON.stringify(data.members));
  document.getElementById("msg").textContent=
   "Restore भयो। Dashboard खोल्नुहोस्।";
 }catch(e){
  alert("Restore असफल भयो। सही JSON फाइल छान्नुहोस्।");
 }
}
</script>
</body>
</html>
